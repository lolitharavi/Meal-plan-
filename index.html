<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24533a">
<title>Meal Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
:root{
  /* Layout: phone-first single column, sticky header, bottom tab bar (5 views). Banana-leaf green + turmeric. */
  --leaf:#24533a; --leaf-soft:#e3efe6; --turmeric:#d99a06; --turmeric-soft:#fdf1d3;
  --chilli:#b4432a; --ink:#1c2420; --muted:#5e6b64; --paper:#f6f8f5; --card:#ffffff; --line:#d9e1db;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --leaf:#7cc496; --leaf-soft:#1d3226; --turmeric:#f2b632; --turmeric-soft:#3a2f12;
    --chilli:#ee8a70; --ink:#e7ece8; --muted:#9aa8a0; --paper:#111613; --card:#1a211d; --line:#2c3630; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --leaf:#7cc496; --leaf-soft:#1d3226; --turmeric:#f2b632; --turmeric-soft:#3a2f12;
  --chilli:#ee8a70; --ink:#e7ece8; --muted:#9aa8a0; --paper:#111613; --card:#1a211d; --line:#2c3630; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
header{position:sticky;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px))!important;z-index:5;background:var(--leaf);color:#fff;padding:14px 16px 12px}
:root[data-theme="dark"] header{color:#0f1a13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header{color:#0f1a13}}
header h1{font-family:var(--display);font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px 16px 96px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:19px;margin:6px 0 0;text-wrap:balance}
h3{font-size:15px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.meal{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:4px}
.meal .lbl{font-weight:700;color:var(--leaf);font-size:14px}
.meal .who{display:block;font-size:13px;color:var(--muted)}
.tonight{background:var(--turmeric-soft);border-color:var(--turmeric)}
.tonight .cook{font-family:var(--display);font-size:18px;margin:4px 0 8px}
ul.items{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.items b{color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf)}
.pill.warm{background:var(--turmeric-soft);color:var(--chilli)}
.rules{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules div{display:flex;gap:8px}
.rules div::before{content:"✓";color:var(--leaf);font-weight:700}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row label{flex:1;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--leaf);flex:0 0 auto;margin:0}
.row .q{font-size:13px;color:var(--muted);display:block}
.row .p{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.row.done .n{text-decoration:line-through;color:var(--muted)}
.cat{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);padding:10px 0 2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);width:0}
.btn{font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:focus-visible,.days button:focus-visible,nav button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .k{font-size:13px;color:var(--muted)}
.tile.main{grid-column:1/-1;background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.tile.main .k{color:inherit;opacity:.85}
.price{width:76px;font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.note{font-size:13px;color:var(--muted)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details+details{margin-top:8px}
summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:700;color:var(--leaf);font-size:20px}
details[open] summary::after{content:"–"}
summary .t{font-weight:700}
summary .w{display:block;font-size:13px;color:var(--muted);font-weight:400}
details .body{padding:0 0 14px;display:flex;flex-direction:column;gap:10px}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.search{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;font:inherit;font-size:11px;color:var(--muted);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--leaf);font-weight:700}
.hide{display:none!important}
.kc{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.cal{display:flex;flex-direction:column;gap:12px}
.cal .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.cal .who b{font-size:15px}
.cal .who span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.cal .bar i.over{background:var(--chilli)}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add select,.add input{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.add .wide{grid-column:1/-1}
.food{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.food button{background:none;border:0;color:var(--chilli);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
.extra-tick{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-top:10px;cursor:pointer}
.extra-tick input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.tg{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.tg input{width:96px;font:inherit;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
header{display:flex;align-items:flex-start;gap:10px}
header .ht{flex:1;min-width:0}
.gear{background:none;border:0;color:inherit;padding:6px;margin:-4px -6px 0 0;border-radius:10px;cursor:pointer;line-height:0}
.gear svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
.eat{display:flex;width:max-content;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.eat input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.meal.ate>div:last-child>.txt{text-decoration:line-through;color:var(--muted)}
.eat.on{color:var(--leaf)}
.days button .ck{display:block;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.set{display:flex;flex-direction:column;gap:12px}
.set .line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.set input[type=time]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.switch{width:22px;height:22px;accent-color:var(--leaf)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.msg{font-size:14px;font-weight:700;color:var(--leaf);min-height:1.2em}
.msg.err{color:var(--chilli)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

   '<h2>'+esc(weekDay==="Sunday (before week)"?"Sunday before week 1":weekDay)+'</h2>'+
   (weekDay==="Sunday (before week)"?'<p class="note">First week only: cook Monday’s lunch and do Monday’s breakfast prep.</p>':mealsCard(d)+'<h2>Calories</h2>'+calCard(weekDay))+
   tonightCard(d,weekDay==="Sunday (before week)"?"Cook on Sunday night":"Cook on "+weekDay+" night");
  app.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{weekDay=b.dataset.d;viewWeek()});
  const redraw=()=>{const y=window.scrollY;viewWeek();window.scrollTo(0,y)};
  bindMeals(redraw);if(weekDay!=="Sunday (before week)")bindCal(weekDay,redraw);
}
function allShopKeys(){const k=[];DATA.weekly.forEach(c=>c.items.forEach(i=>k.push("w:"+i.n)));DATA.packs.forEach(p=>k.push("p:"+p.n));return k}
function price(key,def){return prices[key]!=null&&prices[key]!==""?Number(prices[key]):def}
function viewShop(){
  setHead("Shopping list","Ticks are saved on this phone");
  const wk=DATA.weekly.flatMap(c=>c.items.map(i=>"w:"+i.n)), pk=DATA.packs.map(p=>"p:"+p.n);
  const done=wk.filter(k=>ticks[k]).length;
  const row=(key,n,q,p)=>'<div class="row'+(ticks[key]?' done':'')+'"><label><input type="checkbox" data-k="'+esc(key)+'"'+(ticks[key]?' checked':'')+'><span><span class="n">'+esc(n)+'</span><span class="q">'+esc(q)+'</span></span></label><span class="p">'+aed(p)+'</span></div>';
  let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px"><strong>'+done+' of '+wk.length+' weekly items bought</strong><button class="btn" id="reset">Start new week</button></div><div class="bar"><i style="width:'+(100*done/wk.length)+'%"></i></div></div>';
  h+='<h2>Buy every week</h2><div class="card">';
  DATA.weekly.forEach(c=>{h+='<div class="cat">'+esc(c.cat)+'</div>';c.items.forEach(i=>h+=row("w:"+i.n,i.n,i.q,price("w:"+i.n,i.p)))});
  h+='</div><h2>Packs: buy only when finished</h2><p class="note">Tick a pack when you buy it; it stays ticked until you untick it.</p><div class="card">';
  DATA.packs.forEach(p=>h+=row("p:"+p.n,p.n,p.q+" · lasts about "+p.w+" weeks",price("p:"+p.n,p.p)));
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.onchange=()=>{ticks[cb.dataset.k]=cb.checked;store.set("mp_ticks",ticks);viewShop()});
  const r=document.getElementById("reset");let armed=false;
  r.onclick=()=>{if(!armed){armed=true;r.textContent="Tap again to clear";setTimeout(()=>{armed=false;r.textContent="Start new week"},3000);return}
    wk.forEach(k=>delete ticks[k]);store.set("mp_ticks",ticks);viewShop()};
}
function totals(){
  const fresh=DATA.weekly.reduce((s,c)=>s+c.items.reduce((a,i)=>a+price("w:"+i.n,i.p),0),0);
  const packWeek=DATA.packs.reduce((s,p)=>s+price("p:"+p.n,p.p)/p.w,0);
  const packAll=DATA.packs.reduce((s,p)=>s+price("p:"+p.n,p.p),0);
  return{fresh,packWeek,packAll,week:fresh+packWeek,month:(fresh+packWeek)*4.33,first:fresh+packAll};
}
function viewBudget(){
  setHead("Budget","Change a price and totals update");
  const t=totals();
  let pid=0;const inp=(key,def)=>'<input class="price" type="number" inputmode="decimal" min="0" step="0.5" id="price-'+(pid++)+'" data-k="'+esc(key)+'" value="'+price(key,def)+'" aria-label="Price of '+esc(key.slice(2))+'">';
  let h='<div class="tiles" id="tiles"></div><p class="note">Prices checked Nov 2026 (Carrefour, Lulu, FreshToHome, UAE MoET averages). Fish and prawns change the most.</p>';
  h+='<h2>Weekly fresh items</h2><div class="card">';
  DATA.weekly.forEach(c=>{h+='<div class="cat">'+esc(c.cat)+'</div>';c.items.forEach(i=>h+='<div class="row"><span style="flex:1"><span class="n">'+esc(i.n)+'</span><span class="q">'+esc(i.q)+'</span></span>'+inp("w:"+i.n,i.p)+'</div>')});
  h+='</div><h2>Packs</h2><div class="card">';
  DATA.packs.forEach(p=>h+='<div class="row"><span style="flex:1"><span class="n">'+esc(p.n)+'</span><span class="q">'+esc(p.q)+' · lasts ~'+p.w+' wk · uses '+esc(p.u)+'/wk</span></span>'+inp("p:"+p.n,p.p)+'</div>');
  h+='</div><button class="btn" id="resetp">Restore original prices</button>';
  app.innerHTML=h;drawTiles();
  app.querySelectorAll(".price").forEach(i=>i.oninput=()=>{prices[i.dataset.k]=i.value;store.set("mp_prices",prices);drawTiles()});
  const r=document.getElementById("resetp");let armed=false;
  r.onclick=()=>{if(!armed){armed=true;r.textContent="Tap again to restore";setTimeout(()=>{armed=false;r.textContent="Restore original prices"},3000);return}
    prices={};store.set("mp_prices",prices);viewBudget()};
}
function drawTiles(){
  const t=totals();
  document.getElementById("tiles").innerHTML=
   '<div class="tile main"><div class="k">Average weekly food cost</div><div class="v">'+aed(t.week)+'</div></div>'+
   '<div class="tile"><div class="k">Per month</div><div class="v">'+aed(t.month)+'</div></div>'+
   '<div class="tile"><div class="k">Weekly fresh shop</div><div class="v">'+aed(t.fresh)+'</div></div>'+
   '<div class="tile"><div class="k">Packs, per week</div><div class="v">'+aed(t.packWeek)+'</div></div>'+
   '<div class="tile"><div class="k">First shop (all packs)</div><div class="v">'+aed(t.first)+'</div></div>';
}
function viewRecipes(){
  setHead("Recipes","Amounts for 2 meals, 3 people");
  let q=app.dataset.q||"";
  const groups=[...new Set(RECIPES.map(r=>r.g))];
  const render=()=>{
    const f=q.trim().toLowerCase();
    document.getElementById("rlist").innerHTML=groups.map(g=>{
      const rs=RECIPES.filter(r=>r.g===g&&(!f||(r.n+" "+r.when+" "+r.ing.join(" ")).toLowerCase().includes(f)));
      if(!rs.length)return"";
      return'<h2>'+esc(g)+'</h2>'+rs.map(r=>'<details><summary><span><span class="t">'+esc(r.n)+'</span><span class="w">'+esc(r.when)+'</span></span></summary><div class="body"><div><h3>You need</h3><ul class="items" style="margin-top:6px">'+r.ing.map(i=>'<li>'+esc(i)+'</li>').join("")+'</ul></div><div><h3>Steps</h3><ol style="margin-top:6px">'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol></div></div></details>').join("");
    }).join("")||'<p class="note">No recipe matches “'+esc(q)+'”. Try “ragi”, “chicken” or “egg”.</p>';
  };
  app.innerHTML='<input class="search" id="rsearch" type="search" placeholder="Search: ragi, prawn, egg…" value="'+esc(q)+'" aria-label="Search recipes"><div id="rlist"></div>';
  render();
  document.getElementById("rsearch").oninput=e=>{q=e.target.value;app.dataset.q=q;render()};
}
const NATIVE=window.MealApp||null;
function backupJson(){return JSON.stringify({app:"meal-plan",version:1,saved:new Date().toISOString(),mp_ticks:ticks,mp_prices:prices,mp_meals:meals,mp_food:food,mp_targets:targets},null,1)}
function restoreJson(text){
  let o;try{o=JSON.parse(text)}catch(e){return "That file isn't a Meal Plan backup."}
  if(!o||o.app!=="meal-plan")return "That file isn't a Meal Plan backup.";
  ticks=o.mp_ticks||{};prices=o.mp_prices||{};meals=o.mp_meals||{};food=o.mp_food||{};if(o.mp_targets)targets=o.mp_targets;
  store.set("mp_ticks",ticks);store.set("mp_prices",prices);store.set("mp_meals",meals);store.set("mp_food",food);store.set("mp_targets",targets);
  return "";
}
window.onBackupResult=(kind,ok,text)=>{
  const m=document.getElementById("bmsg");
  let msg="",err=false;
  if(kind==="save"){msg=ok?"Backup saved.":(text||"Backup not saved.");err=!ok}
  else if(kind==="open"){if(!ok){msg=text||"No file chosen.";err=true}else{const e=restoreJson(text);msg=e||"Restored. Your ticks and prices are back.";err=!!e}}
  if(m){m.textContent=msg;m.className="msg"+(err?" err":"")}
};
window.onReminderPermission=granted=>{if(location.hash==="#settings")viewSettings(granted?"":"Notifications are blocked. Allow them for Meal Plan in your phone's Settings, then turn the reminder on again.")};
function reminderState(){return store.get("mp_reminder",{on:false,time:"19:00"})}
function syncReminder(){
  if(!NATIVE)return;
  const r=reminderState(),[h,mi]=r.time.split(":").map(Number);
  const cook={};DAY_NAMES.forEach(n=>{const d=dayRow(n);cook[n]=d.cook});
  try{NATIVE.setReminder(!!r.on,h,mi,JSON.stringify(cook))}catch(e){}
}
function viewSettings(note){
  setHead("Settings","Reminder, calories and backup");
  const r=reminderState();
  let h='<h2>Evening reminder</h2><div class="card set">';
  if(NATIVE){
    h+='<label class="line"><span><strong>Remind me to cook</strong><span class="note" style="display:block">Each evening, a notification tells you tonight’s dinner and breakfast prep.</span></span><input class="switch" type="checkbox" id="ron"'+(r.on?' checked':'')+'></label>'+
       '<label class="line"><span>Time</span><input type="time" id="rtime" value="'+esc(r.time)+'"></label>'+
       '<div class="msg'+(note?' err':'')+'" id="rmsg">'+esc(note||(r.on?"Reminder is on for "+r.time+" every day.":""))+'</div>';
  }else h+='<p class="note" style="margin:0">Evening reminders work in the Android app. iPhone doesn’t let web apps set daily reminders, so set a daily alarm in the Clock app instead.</p>';
  h+='</div><h2>Daily calorie targets</h2><div class="card set"><div class="tg">'+PEOPLE.map((p,i)=>'<label for="tg'+i+'">'+p+'</label><input id="tg'+i+'" type="number" inputmode="numeric" min="0" max="6000" step="50" value="'+(Number(targets[p])||0)+'">').join("")+'</div><p class="note" style="margin:0">Set 0 to hide a target. Ask a doctor or dietitian for the right numbers, especially for your son.</p></div>';
  h+='<h2>Backup</h2><div class="card set"><p class="note" style="margin:0">Save your meal ticks, shopping ticks and prices to a file, for example in Google Drive. Restore it after changing phones or reinstalling.</p>'+
     '<div class="btns"><button class="btn" id="bsave">Save backup</button><button class="btn" id="bopen">Restore from backup</button></div><div class="msg" id="bmsg"></div>'+
     (NATIVE?'':'<input type="file" id="bfile" accept="application/json,.json" class="hide">')+'</div>'+
     '<h2>About</h2><div class="card"><p class="note" style="margin:0">Meal Plan works offline. Everything is saved on this phone only.</p></div>';
  app.innerHTML=h;
  PEOPLE.forEach((p,i)=>{const el=document.getElementById("tg"+i);el.oninput=()=>{targets[p]=Math.max(0,Number(el.value)||0);store.set("mp_targets",targets)}});
  if(NATIVE){
    const on=document.getElementById("ron"),tm=document.getElementById("rtime");
    const save=()=>{const st={on:on.checked,time:tm.value||"19:00"};store.set("mp_reminder",st);syncReminder();
      if(st.on){try{NATIVE.ensureNotificationPermission()}catch(e){}}
      const m=document.getElementById("rmsg");m.className="msg";m.textContent=st.on?"Reminder is on for "+st.time+" every day.":"Reminder is off."};
    on.onchange=save;tm.onchange=save;
  }
  document.getElementById("bsave").onclick=()=>{
    const name="meal-plan-backup-"+new Date().toISOString().slice(0,10)+".json";
    if(NATIVE)NATIVE.saveBackup(name,backupJson());
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupJson()],{type:"application/json"}));a.download=name;a.click();window.onBackupResult("save",true)}
  };
  document.getElementById("bopen").onclick=()=>{
    if(NATIVE)NATIVE.openBackup();
    else{const f=document.getElementById("bfile");f.onchange=()=>{const file=f.files[0];if(!file)return;file.text().then(t=>window.onBackupResult("open",true,t))};f.click()}
  };
}
function setHead(t,s){document.getElementById("htitle").textContent=t;document.getElementById("hsub").textContent=s}
const VIEWS={today:viewToday,week:viewWeek,shop:viewShop,budget:viewBudget,recipes:viewRecipes,settings:viewSettings};
document.getElementById("gear").onclick=()=>{location.hash="settings"};
function show(){
  const v=VIEWS[location.hash.slice(1)]?location.hash.slice(1):"today";
  document.querySelectorAll("nav button").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  VIEWS[v]();window.scrollTo(0,0);
  document.getElementById("gear").classList.toggle("hide",v==="settings");
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(location.hash==="#"+b.dataset.v)show();else location.hash=b.dataset.v});
window.addEventListener("hashchange",show);
window.addEventListener("pageshow",()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(location.hash===""||location.hash==="#today"||location.hash==="#week"))show()});
show();
syncReminder();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
